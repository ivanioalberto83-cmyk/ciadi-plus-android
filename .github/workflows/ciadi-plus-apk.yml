name: CIADI+ - Audit e APK

on:
  push:
    branches: [ main ]
    paths:
      - 'ciadi+ (1).zip'
      - '.github/workflows/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/copilot-instructions.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ciadi-plus-apk
  cancel-in-progress: true

jobs:
  audit-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Select Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          if [ -f 'android-source/settings.gradle.kts' ] || [ -f 'android-source/settings.gradle' ]; then
            PROJECT_DIR="$(cd android-source && pwd)"
          else
            test -f 'ciadi+ (1).zip'
            mkdir -p extracted
            unzip -q 'ciadi+ (1).zip' -d extracted
            SETTINGS="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [ -z "$SETTINGS" ]; then
              echo "ERROR: no Gradle settings file found inside ZIP."
              find extracted -maxdepth 4 -type f | sort | head -300
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS")"
            PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Audit clinical forms source flow
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          REPORT="$GITHUB_WORKSPACE/ciadi-clinical-forms-source-audit.txt"
          : > "$REPORT"
          {
            echo "CIADI+ - Clinical Forms Source Audit"
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "== Relevant source files =="
            find app/src/main -type f \( -name '*.kt' -o -name '*.java' \) | sort | grep -Ei 'form|document|clinical|avali|triag|supabase' || true
            echo
            echo "== ClinicalFormSubmission references =="
            grep -RInE 'ClinicalFormSubmission|FormularioClinicoDto|syncFormularios' app/src/main || true
            echo
            echo "== Repository clinical/document methods =="
            grep -RInE 'emitirDocumentoClinico|emitirDocumento|getHistoricoDocumento|syncDocumentos|registrarAcompanhamentoAba|registrarObjetivo|registrarIncidente|registrarSessao' app/src/main || true
            echo
            echo "== Supabase table references =="
            grep -RInE 'ciadi_formularios_clinicos|documentos_clinicos|ciadi_documentos_clinicos_historico|ciadi_avaliacoes_clinicas|ciadi_avaliacoes_respostas|ciadi_avaliacoes_resultados|ciadi_triagens' app/src/main || true
            echo
            echo "== Form submission verbs/calls =="
            grep -RInE '\.(insert|update|upsert|delete|select)\(' app/src/main | grep -Ei 'form|document|clinical|avali|triag|supabase' || true
          } >> "$REPORT"
          test -s "$REPORT"
          echo "Clinical forms source audit created: $REPORT"
          sed -n '1,260p' "$REPORT"

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            ${{ env.PROJECT_DIR }}/**/*.gradle*
            ${{ env.PROJECT_DIR }}/**/gradle-wrapper.properties

      - name: Static security audit - application source only
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -d app/src/main
          SOURCES="$(find app/src/main -type f \( -name '*.kt' -o -name '*.java' \) -print)"
          if [ -z "$SOURCES" ]; then
            echo "ERROR: no Kotlin/Java application source found."
            exit 1
          fi
          if grep -nE 'SUPABASE_SERVICE_ROLE_KEY|LIVEKIT_API_SECRET|LIVEKIT_API_KEY|service_role' $SOURCES; then
            echo "ERROR: forbidden server-side secret reference detected in Kotlin/Java application source."
            exit 1
          fi
          if grep -nE '([?&])(role|token|access_token|refresh_token|livekit_token)=' $SOURCES; then
            echo "ERROR: sensitive role/token found being appended to a URL in Kotlin/Java application source."
            exit 1
          fi
          echo "Static security checks passed for Kotlin/Java application source."

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle test --no-daemon --stacktrace

      - name: Create CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f debug.keystore
          ls -lh debug.keystore

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Align and explicitly sign APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          test -n "$APK"
          echo "Unsigned APK produced by Gradle: $APK"
          ls -lh "$APK"

          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign -print | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          ALIGNED="$GITHUB_WORKSPACE/CIADI-plus-debug-aligned.apk"
          SIGNED="$GITHUB_WORKSPACE/CIADI-plus-debug.apk"

          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"

          "$APKSIGNER" sign \
            --ks "$PROJECT_DIR/debug.keystore" \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out "$SIGNED" \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"

          test -s "$SIGNED"
          sha256sum "$SIGNED" | tee "$GITHUB_WORKSPACE/CIADI-plus-debug.apk.sha256"
          ls -lh "$SIGNED"
          file "$SIGNED"
          rm -f "$ALIGNED"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/CIADI-plus-debug.apk"
          test -f "$GITHUB_WORKSPACE/CIADI-plus-debug.apk.sha256"

          # Refuse to publish an unsigned/invalid APK.
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$GITHUB_WORKSPACE/CIADI-plus-debug.apk"

          echo "Final installable APK:"
          ls -lh "$GITHUB_WORKSPACE/CIADI-plus-debug.apk"
          cat "$GITHUB_WORKSPACE/CIADI-plus-debug.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CIADI-plus-2.0.1-debug-apk
          path: |
            CIADI-plus-debug.apk
            CIADI-plus-debug.apk.sha256
          retention-days: 30

      - name: Export source for implementation audit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          rm -rf source-export
          mkdir -p source-export
          cp -a app/src source-export/
          cp -a gradle source-export/ 2>/dev/null || true
          cp -a build.gradle* settings.gradle* gradle.properties source-export/ 2>/dev/null || true
          zip -qr "$GITHUB_WORKSPACE/CIADI-plus-source-audit.zip" source-export

      - name: Upload source audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CIADI-plus-source-audit
          path: CIADI-plus-source-audit.zip
          retention-days: 7

      - name: Upload audit reports
        if: always() && env.PROJECT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: CIADI-plus-audit-report
          path: |
            ciadi-clinical-forms-source-audit.txt
            ${{ env.PROJECT_DIR }}/**/test-results/**/*.xml
            ${{ env.PROJECT_DIR }}/**/reports/**
          if-no-files-found: ignore
          retention-days: 30
